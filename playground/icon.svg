<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#4da3ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Book -->
  <g transform="translate(160,140)">
    <rect x="0" y="10" width="120" height="170" rx="8" fill="#fff" opacity="0.95"/>
    <rect x="120" y="10" width="60" height="170" rx="0" fill="#e8e8e8" opacity="0.95"/>
    <line x1="120" y1="10" x2="120" y2="180" stroke="#ccc" stroke-width="1.5"/>
    <line x1="20" y1="50" x2="100" y2="50" stroke="#ccc" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="70" x2="100" y2="70" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="88" x2="80" y2="88" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="110" x2="100" y2="110" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="128" x2="90" y2="128" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Timer ring -->
  <circle cx="330" cy="180" r="70" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="10"/>
  <circle cx="330" cy="180" r="70" fill="none" stroke="#fff" stroke-width="10"
          stroke-dasharray="440" stroke-dashoffset="110" stroke-linecap="round"
          transform="rotate(-90 330 180)"/>
  <!-- Timer hand -->
  <line x1="330" y1="180" x2="330" y2="130" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="330" cy="180" r="8" fill="#fff"/>
</svg>
