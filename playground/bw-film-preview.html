<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>黑白胶片冲洗预览</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel-bg: rgba(30, 30, 30, 0.95);
    --text: #ccc;
    --accent: #e0c080;
    --slider-track: #444;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Helvetica Neue', sans-serif;
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── viewfinder ── */
  .viewfinder {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: auto;
    transition: transform 0.2s ease-out;
    transform-origin: center center;
  }
  canvas.zoomed {
    transform: scale(2);
  }

  /* ── top bar ── */
  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
  }

  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .title {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  .lens-badge {
    font-size: 11px;
    color: #999;
    background: rgba(255,255,255,0.1);
    padding: 4px 10px;
    border-radius: 20px;
  }

  .zoom-btn {
    font-size: 11px;
    color: var(--accent);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 4px 12px;
    border-radius: 20px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
  }
  .zoom-btn:active {
    background: rgba(255,255,255,0.2);
  }
  .zoom-btn.active {
    background: rgba(224,192,128,0.25);
    border-color: var(--accent);
    color: #fff;
  }
  .zoom-btn.hidden {
    display: none;
  }

  /* ── bottom control panel ── */
  .panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 10;
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 14px 16px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
  }

  /* ── contrast quick picks ── */
  .contrast-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .contrast-btn {
    flex: 1;
    padding: 7px 0;
    font-size: 12px;
    font-weight: 500;
    color: #aaa;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .contrast-btn.active {
    color: #fff;
    background: rgba(224,192,128,0.2);
    border-color: var(--accent);
  }
  .contrast-btn:active {
    background: rgba(255,255,255,0.15);
  }

  /* ── EV row ── */
  .ev-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .ev-row .slider-item {
    flex: 1;
    margin-bottom: 0;
  }
  .ev-label {
    font-size: 11px;
    color: #999;
    width: 28px;
    text-align: right;
    flex-shrink: 0;
  }
  .ev-value {
    font-size: 11px;
    color: var(--accent);
    width: 44px;
    text-align: left;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  .meter-btn {
    font-size: 11px;
    color: #999;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .meter-btn:active {
    background: rgba(255,255,255,0.15);
  }
  .meter-btn.active {
    color: #fff;
    background: rgba(255,180,80,0.25);
    border-color: #ffb450;
  }

  /* spot meter reticle */
  .spot-reticle {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    width: 44px;
    height: 44px;
    border: 2px solid #ffb450;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px rgba(255,180,80,0.5), inset 0 0 8px rgba(255,180,80,0.25);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .spot-reticle.show {
    opacity: 1;
  }

  /* ── sliders ── */
  .slider-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 12px;
  }

  .slider-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .slider-label {
    font-size: 11px;
    color: #999;
    width: 36px;
    text-align: right;
    flex-shrink: 0;
  }

  .slider-value {
    font-size: 11px;
    color: #777;
    width: 30px;
    text-align: left;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    flex: 1;
    height: 4px;
    background: var(--slider-track);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--accent);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* ── bottom row ── */
  .action-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .freeze-btn {
    flex: 1;
    padding: 12px 0;
    font-size: 14px;
    font-weight: 600;
    color: #111;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.03em;
    -webkit-tap-highlight-color: transparent;
  }
  .freeze-btn:active {
    opacity: 0.8;
  }
  .freeze-btn.active {
    background: #ff6b6b;
    color: #fff;
  }

  .reset-btn {
    padding: 12px 16px;
    font-size: 13px;
    color: #999;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .reset-btn:active {
    background: rgba(255,255,255,0.15);
  }

  /* ── info overlay ── */
  .info-toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
    padding: 10px 24px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 13px;
    border-radius: 10px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .info-toast.show {
    opacity: 1;
  }

  /* ── start overlay ── */
  .start-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    gap: 16px;
  }
  .start-overlay.hidden {
    display: none;
  }
  .start-btn {
    padding: 16px 48px;
    font-size: 18px;
    font-weight: 600;
    color: #111;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: 0.04em;
    -webkit-tap-highlight-color: transparent;
  }
  .start-btn:active {
    opacity: 0.8;
  }
  .start-hint {
    font-size: 12px;
    color: #666;
    text-align: center;
    line-height: 1.6;
    max-width: 260px;
  }
  .start-error {
    font-size: 13px;
    color: #ff6b6b;
    text-align: center;
    max-width: 300px;
    line-height: 1.6;
    display: none;
  }
  .start-error.show {
    display: block;
  }

  /* ── photo mode toggle ── */
  .photo-only { display: none; }
  body.photo-mode .photo-only { display: block; }
  body.photo-mode .live-only { display: none; }
  body.photo-mode .start-overlay { gap: 12px; }

  #captureBtn, #galleryBtn {
    width: 200px;
  }
  #galleryBtn {
    background: rgba(255,255,255,0.1);
    color: #ccc;
    border: 1px solid rgba(255,255,255,0.2);
    font-size: 14px;
  }
</style>
</head>
<body>

<!-- 点测光准星 -->
<div class="spot-reticle" id="spotReticle"></div>

<!-- ── 启动遮罩 ── -->
<div class="start-overlay" id="startOverlay">
  <button class="start-btn live-only" id="startBtn">📷 启动相机</button>
  <span class="start-hint live-only" id="startHint">点击以授权摄像头访问</span>

  <span class="start-hint photo-only" id="photoHint">
    实时预览需 HTTPS。当前为 <strong id="currentProto"></strong> 协议，使用拍照模式。
  </span>
  <button class="start-btn photo-only" id="captureBtn">📸 拍照</button>
  <button class="start-btn photo-only" id="galleryBtn">🖼️ 选择照片</button>

  <span class="start-error" id="startError"></span>
</div>

<!-- 隐藏的文件输入 -->
<input type="file" id="captureInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="galleryInput" accept="image/*" style="display:none">

<div class="viewfinder">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div class="top-bar">
  <div class="top-bar-left">
    <span class="title" id="titleBar">黑白负片预览</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="zoom-btn" id="zoomBtn" onclick="toggleZoom()">🔍 2x</button>
    <span class="lens-badge" id="lensLabel">标准</span>
  </div>
</div>

<div class="panel">
  <!-- 对比度快捷 -->
  <div class="contrast-row" id="contrastBtns">
    <button class="contrast-btn active" data-preset="normal">标准</button>
    <button class="contrast-btn" data-preset="low">低</button>
    <button class="contrast-btn" data-preset="medium">中</button>
    <button class="contrast-btn" data-preset="high">高</button>
  </div>

  <!-- EV 曝光补偿 + 点测光 -->
  <div class="ev-row">
    <span class="ev-label">EV</span>
    <div class="slider-item">
      <input type="range" id="ev" min="-30" max="30" value="0" step="1">
    </div>
    <span class="ev-value" id="evVal">±0.0</span>
    <button class="meter-btn" id="meterBtn" onclick="toggleSpotMeter()">⊙ 点测光</button>
  </div>

  <!-- 滑块 -->
  <div class="slider-group">
    <div class="slider-item">
      <span class="slider-label">对比度</span>
      <input type="range" id="contrast" min="50" max="200" value="100" step="1">
      <span class="slider-value" id="contrastVal">1.00</span>
    </div>
    <div class="slider-item">
      <span class="slider-label">高光</span>
      <input type="range" id="highlights" min="-100" max="100" value="0" step="1">
      <span class="slider-value" id="highlightsVal">0</span>
    </div>
    <div class="slider-item">
      <span class="slider-label">阴影</span>
      <input type="range" id="shadows" min="-100" max="100" value="0" step="1">
      <span class="slider-value" id="shadowsVal">0</span>
    </div>
  </div>

  <!-- 操作行 -->
  <div class="action-row">
    <button class="freeze-btn" id="freezeBtn" onclick="toggleFreeze()">❄️ 冻结画面</button>
    <button class="reset-btn" onclick="resetAll()">重置</button>
  </div>
</div>

<div class="info-toast" id="toast"></div>

<script>
// ─────────────────────────────────────
// state
// ─────────────────────────────────────
let stream = null;
let frozen = false;
let frozenFrame = null;
let animationId = null;

// zoom
let zoomed = false;

// photo mode
let photoMode = false;
let loadedImage = null;
let photoImageData = null;

// sliders
let contrastVal = 100;
let highlightsVal = 0;
let shadowsVal = 0;
let evVal = 0;              // EV compensation: -3.0 .. +3.0 (stored as slider int * 10)
let spotMeterActive = false;

// DOM
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const contrastSlider = document.getElementById('contrast');
const highlightsSlider = document.getElementById('highlights');
const shadowsSlider = document.getElementById('shadows');
const evSlider = document.getElementById('ev');
const contrastValEl = document.getElementById('contrastVal');
const highlightsValEl = document.getElementById('highlightsVal');
const shadowsValEl = document.getElementById('shadowsVal');
const evValEl = document.getElementById('evVal');
const freezeBtn = document.getElementById('freezeBtn');
const zoomBtn = document.getElementById('zoomBtn');
const meterBtn = document.getElementById('meterBtn');
const lensLabel = document.getElementById('lensLabel');
const titleBar = document.getElementById('titleBar');
const toast = document.getElementById('toast');
const spotReticle = document.getElementById('spotReticle');

const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const startHint = document.getElementById('startHint');
const startError = document.getElementById('startError');
const captureBtn = document.getElementById('captureBtn');
const galleryBtn = document.getElementById('galleryBtn');
const captureInput = document.getElementById('captureInput');
const galleryInput = document.getElementById('galleryInput');
const photoHint = document.getElementById('photoHint');
const currentProto = document.getElementById('currentProto');

let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
}

function showStartError(msg) {
  startError.textContent = msg;
  startError.classList.add('show');
}

// ─────────────────────────────────────
// 缩放切换
// ─────────────────────────────────────
function toggleZoom() {
  zoomed = !zoomed;
  if (zoomed) {
    canvas.classList.add('zoomed');
    zoomBtn.textContent = '🔍 1x';
    zoomBtn.classList.add('active');
  } else {
    canvas.classList.remove('zoomed');
    zoomBtn.textContent = '🔍 2x';
    zoomBtn.classList.remove('active');
  }
}

// ─────────────────────────────────────
// 检测安全上下文
// ─────────────────────────────────────
function isSecureContext() {
  if (window.isSecureContext) return true;
  if (location.protocol === 'file:') return false;
  if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return false;
  return true;
}

// ─────────────────────────────────────
// 点测光
// ─────────────────────────────────────
function toggleSpotMeter() {
  spotMeterActive = !spotMeterActive;
  if (spotMeterActive) {
    meterBtn.textContent = '⊙ 测光中…';
    meterBtn.classList.add('active');
    showToast('点击画面中想要正确曝光的位置');
  } else {
    meterBtn.textContent = '⊙ 点测光';
    meterBtn.classList.remove('active');
    spotReticle.classList.remove('show');
  }
}

function getCanvasContentRect() {
  const canvasRect = canvas.getBoundingClientRect();
  const canvasAspect = canvas.width / canvas.height;
  const viewportAspect = canvasRect.width / canvasRect.height;

  let contentWidth, contentHeight, offsetX, offsetY;
  if (viewportAspect > canvasAspect) {
    contentHeight = canvasRect.height;
    contentWidth = contentHeight * canvasAspect;
    offsetX = (canvasRect.width - contentWidth) / 2;
    offsetY = 0;
  } else {
    contentWidth = canvasRect.width;
    contentHeight = contentWidth / canvasAspect;
    offsetX = 0;
    offsetY = (canvasRect.height - contentHeight) / 2;
  }
  return { contentWidth, contentHeight, offsetX, offsetY };
}

function sampleLuminanceAt(cx, cy) {
  // Read from source: photoImageData for photo mode, video frame for live mode
  let r, g, b;
  if (photoMode && photoImageData) {
    const idx = (Math.floor(cy) * photoImageData.width + Math.floor(cx)) * 4;
    r = photoImageData.data[idx];
    g = photoImageData.data[idx + 1];
    b = photoImageData.data[idx + 2];
  } else if (!photoMode && video.videoWidth) {
    // Sample from a small region around the point for better accuracy
    const sampleSize = 3;
    let sumR = 0, sumG = 0, sumB = 0, count = 0;
    for (let dy = -sampleSize; dy <= sampleSize; dy++) {
      for (let dx = -sampleSize; dx <= sampleSize; dx++) {
        const sx = Math.floor(cx + dx);
        const sy = Math.floor(cy + dy);
        if (sx < 0 || sy < 0 || sx >= canvas.width || sy >= canvas.height) continue;
        // Draw current video frame to get pixel
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const pixel = ctx.getImageData(sx, sy, 1, 1).data;
        sumR += pixel[0]; sumG += pixel[1]; sumB += pixel[2];
        count++;
      }
    }
    if (count === 0) return null;
    r = sumR / count; g = sumG / count; b = sumB / count;
  } else {
    return null;
  }

  return 0.299 * r + 0.587 * g + 0.114 * b;
}

canvas.addEventListener('click', (e) => {
  if (!spotMeterActive) return;

  const rect = getCanvasContentRect();
  const scaleX = canvas.width / rect.contentWidth;
  const scaleY = canvas.height / rect.contentHeight;
  const cx = (e.clientX - rect.offsetX) * scaleX;
  const cy = (e.clientY - rect.offsetY) * scaleY;

  if (cx < 0 || cy < 0 || cx >= canvas.width || cy >= canvas.height) {
    showToast('点击位置超出画面范围');
    return;
  }

  const lum = sampleLuminanceAt(cx, cy);
  if (lum === null) {
    showToast('无法读取该点亮度');
    return;
  }

  // Calculate EV to make this point 18% gray (≈46 in linear, but we target middle gray 127)
  // We want: 255 - lum * 2^EV = 127  →  lum * 2^EV = 128  →  EV = log2(128 / lum)
  const targetGray = 128;
  let ev = Math.log2(targetGray / Math.max(lum, 1));
  ev = clamp(ev, -3, 3);

  // Set EV slider and state
  evVal = Math.round(ev * 10);
  evSlider.value = evVal;
  updateEvDisplay();

  console.log(`🎯 spot meter: lum=${lum.toFixed(1)}, EV=${(evVal/10).toFixed(2)}`);

  // If photo mode, re-render immediately
  if (photoMode) renderPhotoFrame();

  // Show visual feedback
  spotReticle.style.left = e.clientX + 'px';
  spotReticle.style.top = e.clientY + 'px';
  spotReticle.classList.add('show');

  // Exit spot meter mode
  spotMeterActive = false;
  meterBtn.textContent = '⊙ 点测光';
  meterBtn.classList.remove('active');
  setTimeout(() => spotReticle.classList.remove('show'), 800);

  showToast(`点测光: EV ${(evVal/10).toFixed(2)}`);
});

// Also show reticle on pointer move when spot metering
canvas.addEventListener('pointermove', (e) => {
  if (!spotMeterActive) return;
  spotReticle.style.left = e.clientX + 'px';
  spotReticle.style.top = e.clientY + 'px';
  spotReticle.classList.add('show');
});

// ─────────────────────────────────────
// start camera
// ─────────────────────────────────────
async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  const constraints = {
    video: {
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      facingMode: 'environment',
    },
    audio: false,
  };

  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await video.play();

    video.addEventListener('loadedmetadata', () => {
      resizeCanvas();
    }, { once: true });

    // Try to detect if we have a telephoto lens
    const track = stream.getVideoTracks()[0];
    if (track.getCapabilities) {
      const caps = track.getCapabilities();
      if (caps.zoom && caps.zoom.max >= 3) {
        lensLabel.textContent = '长焦';
      }
    }

    return true;
  } catch (e) {
    console.error('camera error:', e);
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      video.addEventListener('loadedmetadata', () => resizeCanvas(), { once: true });
      return true;
    } catch (e2) {
      console.error('fallback camera error:', e2);
      return false;
    }
  }
}

// ─────────────────────────────────────
// canvas sizing
// ─────────────────────────────────────
function resizeCanvas() {
  if (photoMode && loadedImage) {
    canvas.width = loadedImage.naturalWidth;
    canvas.height = loadedImage.naturalHeight;
  } else {
    const vw = video.videoWidth || 1920;
    const vh = video.videoHeight || 1080;
    canvas.width = vw;
    canvas.height = vh;
  }
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  console.log(`🖼️ canvas: ${canvas.width}x${canvas.height}`);
}

// ─────────────────────────────────────
// image processing pipeline
// ─────────────────────────────────────

const RW = 0.299;
const GW = 0.587;
const BW = 0.114;

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function sCurve(t, contrast) {
  if (Math.abs(contrast - 1) < 0.01) return t;
  const shifted = (t - 0.5) * contrast + 0.5;
  return clamp(shifted, 0, 1);
}

function processFrame(srcData, dstData, width, height) {
  const contrastFactor = contrastVal / 100;
  const highlightAdj = highlightsVal / 100;
  const shadowAdj = shadowsVal / 100;
  const evFactor = Math.pow(2, evVal / 10);  // EV in stops: +1 EV = ×2 brightness

  const total = width * height;

  // First pass: grayscale + EV + invert
  for (let i = 0; i < total; i++) {
    const si = i * 4;
    const di = si;

    const r = srcData[si];
    const g = srcData[si + 1];
    const b = srcData[si + 2];

    // Luminance grayscale
    let gray = RW * r + GW * g + BW * b;

    // Apply EV compensation (exposure shift before inversion)
    gray = clamp(gray * evFactor, 0, 255);

    // Invert (negative film effect)
    gray = 255 - gray;

    dstData[di] = gray;
    dstData[di + 1] = gray;
    dstData[di + 2] = gray;
    dstData[di + 3] = 255;
  }

  // Second pass: contrast + highlight/shadow
  for (let i = 0; i < total; i++) {
    const di = i * 4;
    let v = dstData[di] / 255;

    if (highlightAdj !== 0) {
      const hFactor = highlightAdj > 0
        ? (1 - v) * highlightAdj * 0.5
        : v * Math.abs(highlightAdj) * 0.5;
      v = clamp(v + hFactor * (v > 0.5 ? 1 : v * 2), 0, 1);
    }

    if (shadowAdj !== 0) {
      const sFactor = shadowAdj > 0
        ? (1 - v) * shadowAdj * 0.5
        : v * Math.abs(shadowAdj) * 0.5;
      v = clamp(v + sFactor * (v < 0.5 ? 1 : (1 - v) * 2), 0, 1);
    }

    if (contrastFactor !== 1) {
      v = sCurve(v, contrastFactor);
    }

    const out = Math.round(clamp(v, 0, 1) * 255);
    dstData[di] = out;
    dstData[di + 1] = out;
    dstData[di + 2] = out;
  }
}

// ─────────────────────────────────────
// photo mode: render single frame
// ─────────────────────────────────────
function renderPhotoFrame() {
  if (!photoMode || !photoImageData) return;

  const dstData = new Uint8ClampedArray(photoImageData.data.length);
  processFrame(photoImageData.data, dstData, photoImageData.width, photoImageData.height);
  const outImg = new ImageData(dstData, photoImageData.width, photoImageData.height);
  ctx.putImageData(outImg, 0, 0);
}

// ─────────────────────────────────────
// render loop
// ─────────────────────────────────────
function render() {
  if (photoMode) {
    if (photoImageData) {
      renderPhotoFrame();
    }
    animationId = null;
    return;
  }

  if (!video.videoWidth || video.paused) {
    animationId = requestAnimationFrame(render);
    return;
  }

  if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
    resizeCanvas();
  }

  if (frozen && frozenFrame) {
    const imgData = new ImageData(
      new Uint8ClampedArray(frozenFrame.data),
      frozenFrame.width,
      frozenFrame.height
    );
    const dstData = new Uint8ClampedArray(imgData.data.length);
    processFrame(imgData.data, dstData, imgData.width, imgData.height);
    const outImg = new ImageData(dstData, imgData.width, imgData.height);
    ctx.putImageData(outImg, 0, 0);
  } else {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const srcImg = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const dstData = new Uint8ClampedArray(srcImg.data.length);
    processFrame(srcImg.data, dstData, canvas.width, canvas.height);
    const outImg = new ImageData(dstData, canvas.width, canvas.height);
    ctx.putImageData(outImg, 0, 0);
  }

  animationId = requestAnimationFrame(render);
}

// ─────────────────────────────────────
// freeze
// ─────────────────────────────────────
function toggleFreeze() {
  if (photoMode) {
    showToast('拍照模式下参数可随时调整，点击下方按钮重新拍照');
    return;
  }
  frozen = !frozen;
  if (frozen) {
    frozenFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
    freezeBtn.textContent = '▶️ 恢复实时';
    freezeBtn.classList.add('active');
    showToast('画面已冻结 — 可调整参数对比');
  } else {
    frozenFrame = null;
    freezeBtn.textContent = '❄️ 冻结画面';
    freezeBtn.classList.remove('active');
    showToast('已恢复实时预览');
  }
}

// ─────────────────────────────────────
// contrast presets
// ─────────────────────────────────────
const presets = {
  normal: { contrast: 100, highlights: 0, shadows: 0 },
  low:    { contrast: 70, highlights: 20, shadows: 30 },
  medium: { contrast: 130, highlights: -10, shadows: -10 },
  high:   { contrast: 180, highlights: -30, shadows: -40 },
};

function applyPreset(name) {
  const p = presets[name];
  if (!p) return;
  contrastVal = p.contrast;
  highlightsVal = p.highlights;
  shadowsVal = p.shadows;
  syncSlidersToState();

  document.querySelectorAll('.contrast-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.preset === name);
  });

  if (photoMode) renderPhotoFrame();
}

function syncSlidersToState() {
  contrastSlider.value = contrastVal;
  highlightsSlider.value = highlightsVal;
  shadowsSlider.value = shadowsVal;
  evSlider.value = evVal;
  contrastValEl.textContent = (contrastVal / 100).toFixed(2);
  highlightsValEl.textContent = highlightsVal;
  shadowsValEl.textContent = shadowsVal;
  updateEvDisplay();
}

function updateEvDisplay() {
  const ev = evVal / 10;
  const sign = ev >= 0 ? '+' : '';
  evValEl.textContent = sign + ev.toFixed(1);
}

function resetAll() {
  evVal = 0;
  evSlider.value = 0;
  updateEvDisplay();
  applyPreset('normal');
  showToast('参数已重置');
}

// ─────────────────────────────────────
// slider events
// ─────────────────────────────────────
evSlider.addEventListener('input', () => {
  evVal = parseInt(evSlider.value);
  updateEvDisplay();
  if (photoMode) renderPhotoFrame();
});

contrastSlider.addEventListener('input', () => {
  contrastVal = parseInt(contrastSlider.value);
  contrastValEl.textContent = (contrastVal / 100).toFixed(2);
  document.querySelectorAll('.contrast-btn').forEach(b => b.classList.remove('active'));
  if (photoMode) renderPhotoFrame();
});

highlightsSlider.addEventListener('input', () => {
  highlightsVal = parseInt(highlightsSlider.value);
  highlightsValEl.textContent = highlightsVal;
  document.querySelectorAll('.contrast-btn').forEach(b => b.classList.remove('active'));
  if (photoMode) renderPhotoFrame();
});

shadowsSlider.addEventListener('input', () => {
  shadowsVal = parseInt(shadowsSlider.value);
  shadowsValEl.textContent = shadowsVal;
  document.querySelectorAll('.contrast-btn').forEach(b => b.classList.remove('active'));
  if (photoMode) renderPhotoFrame();
});

// preset buttons
document.getElementById('contrastBtns').addEventListener('click', (e) => {
  const btn = e.target.closest('.contrast-btn');
  if (!btn) return;
  applyPreset(btn.dataset.preset);
});

// ─────────────────────────────────────
// window resize
// ─────────────────────────────────────
window.addEventListener('resize', () => {
  if (video.videoWidth && !photoMode) resizeCanvas();
});

window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    if (video.videoWidth && !photoMode) resizeCanvas();
  }, 300);
});

// ─────────────────────────────────────
// photo mode: load image from file
// ─────────────────────────────────────
function handleImageFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    showToast('请选择图片文件');
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.style.width = '100%';
      canvas.style.height = '100%';

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      photoImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

      console.log(`📸 photo loaded: ${img.naturalWidth}x${img.naturalHeight}`);

      renderPhotoFrame();

      startOverlay.classList.add('hidden');
      showToast('照片已加载 — 调整下方参数查看效果');
    };
    img.onerror = () => {
      showToast('图片加载失败，请重试');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function initPhotoMode() {
  photoMode = true;
  document.body.classList.add('photo-mode');

  titleBar.textContent = '黑白负片预览 · 拍照模式';
  zoomBtn.classList.add('hidden');
  lensLabel.textContent = '照片';
  freezeBtn.textContent = '📸 重新拍照';

  currentProto.textContent = location.protocol;

  captureBtn.addEventListener('click', () => {
    captureInput.click();
  });

  galleryBtn.addEventListener('click', () => {
    galleryInput.click();
  });

  captureInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      handleImageFile(e.target.files[0]);
    }
    e.target.value = '';
  });

  galleryInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      handleImageFile(e.target.files[0]);
    }
    e.target.value = '';
  });

  freezeBtn.onclick = () => {
    captureInput.click();
  };

  syncSlidersToState();
}

// ─────────────────────────────────────
// boot
// ─────────────────────────────────────
function boot() {
  if (!isSecureContext()) {
    initPhotoMode();
  }
}

// ─────────────────────────────────────
// start button (live mode)
// ─────────────────────────────────────
startBtn.addEventListener('click', () => {
  if (photoMode) return;

  (async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStartError('⚠️ 当前浏览器不支持摄像头访问，请使用拍照模式');
      showPhotoFallback();
      return;
    }

    startBtn.textContent = '⏳ 启动中...';
    startBtn.disabled = true;

    const ok = await startCamera();

    if (!ok) {
      console.log('⚠️ 实时摄像头启动失败，降级到拍照模式');
      showPhotoFallback();
      return;
    }

    startOverlay.classList.add('hidden');

    syncSlidersToState();
    render();

    console.log('✅ camera ready');
  })().catch(err => {
    console.error('boot error:', err);
    showPhotoFallback();
  });
});

function showPhotoFallback() {
  initPhotoMode();
  startError.classList.remove('show');
  startError.style.display = 'none';
  showToast('已切换为拍照模式');
}

startOverlay.addEventListener('click', (e) => {
  if (e.target === startOverlay) {
    if (photoMode) return;
    startBtn.click();
  }
});

// ─────────────────────────────────────
// 启动
// ─────────────────────────────────────
boot();
</script>
</body>
</html>
