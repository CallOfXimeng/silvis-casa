<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Board Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b4252" />
      <stop offset="100%" stop-color="#1e222b" />
    </linearGradient>

    <!-- Amber Piece Gradient -->
    <radialGradient id="amberGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <!-- Cyan Piece Gradient -->
    <radialGradient id="cyanGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="25%" stop-color="#06b6d4" />
      <stop offset="75%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#164e63" />
    </radialGradient>

    <!-- Slot Shadow Filter -->
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#000000" flood-opacity="0.9" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#292524" stroke-width="4" filter="url(#dropShadow)" />

  <!-- Subtle Rim Glow -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Vertical Connect Board Stand Plate -->
  <rect x="76" y="86" width="360" height="340" rx="36" fill="url(#boardGrad)" stroke="#4c566a" stroke-width="3" filter="url(#dropShadow)" />

  <!-- 3D Board Inner Frame Border -->
  <rect x="88" y="98" width="336" height="316" rx="26" fill="#141820" opacity="0.6" />

  <!-- Connect Four Slots Grid (3 Rows x 4 Cols Representative Section) -->
  <g>
    <!-- Row 1 (Empty slot, Cyan, Amber, Empty) -->
    <circle cx="140" cy="154" r="34" fill="#090b0e" stroke="#2e3440" stroke-width="4" />
    
    <!-- Cyan Piece (154, 222) -->
    <circle cx="222" cy="154" r="34" fill="url(#cyanGrad)" stroke="#0891b2" stroke-width="2" />
    <ellipse cx="216" cy="144" rx="14" ry="7" fill="#ffffff" opacity="0.45" />

    <!-- Amber Piece (154, 304) -->
    <circle cx="304" cy="154" r="34" fill="url(#amberGrad)" stroke="#b45309" stroke-width="2" />
    <ellipse cx="298" cy="144" rx="14" ry="7" fill="#ffffff" opacity="0.45" />

    <circle cx="386" cy="154" r="34" fill="#090b0e" stroke="#2e3440" stroke-width="4" />

    <!-- Row 2 (Cyan, Amber, Cyan, Amber) -->
    <circle cx="140" cy="246" r="34" fill="url(#cyanGrad)" stroke="#0891b2" stroke-width="2" />
    <ellipse cx="134" cy="236" rx="14" ry="7" fill="#ffffff" opacity="0.45" />

    <!-- Winning Line Highlight Ring on 4-in-a-row demonstration -->
    <circle cx="222" cy="246" r="34" fill="url(#amberGrad)" stroke="#fbbf24" stroke-width="3" />
    <ellipse cx="216" cy="236" rx="14" ry="7" fill="#ffffff" opacity="0.5" />
    <circle cx="222" cy="246" r="38" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.8" stroke-dasharray="6,4" />

    <circle cx="304" cy="246" r="34" fill="url(#cyanGrad)" stroke="#0891b2" stroke-width="2" />
    <ellipse cx="298" cy="236" rx="14" ry="7" fill="#ffffff" opacity="0.45" />

    <circle cx="386" cy="246" r="34" fill="url(#amberGrad)" stroke="#b45309" stroke-width="2" />
    <ellipse cx="380" cy="236" rx="14" ry="7" fill="#ffffff" opacity="0.45" />

    <!-- Row 3 (Amber, Cyan, Amber, Amber) -->
    <circle cx="140" cy="338" r="34" fill="url(#amberGrad)" stroke="#b45309" stroke-width="2" />
    <ellipse cx="134" cy="328" rx="14" ry="7" fill="#ffffff" opacity="0.45" />

    <circle cx="222" cy="338" r="34" fill="url(#cyanGrad)" stroke="#0891b2" stroke-width="2" />
    <ellipse cx="216" cy="328" rx="14" ry="7" fill="#ffffff" opacity="0.45" />

    <circle cx="304" cy="338" r="34" fill="url(#amberGrad)" stroke="#b45309" stroke-width="2" />
    <ellipse cx="298" cy="328" rx="14" ry="7" fill="#ffffff" opacity="0.45" />

    <circle cx="386" cy="338" r="34" fill="url(#cyanGrad)" stroke="#0891b2" stroke-width="2" />
    <ellipse cx="380" cy="328" rx="14" ry="7" fill="#ffffff" opacity="0.45" />
  </g>

  <!-- Number 4 Emblem Badge (Bottom Right Overlay) -->
  <g transform="translate(348, 348)">
    <circle cx="56" cy="56" r="50" fill="#f59e0b" stroke="#ffffff" stroke-width="5" filter="url(#dropShadow)" />
    <path d="M 64 34 L 42 66 L 74 66 M 64 34 L 64 80" fill="none" stroke="#1c1917" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
